<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>2008 螺旋时间轴日历 - D3</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style/calendar.css">
  <!-- 使用 D3 v7 -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
</head>
<body>
<div class="page">
  <div id="heatmap-panel">
    <div class="calendar-wrap" id="calendar"></div>
    <div class="legend" id="legend"></div>
    <div class="tooltip" id="tip"></div>
  </div>
  <div id="spiral-panel"></div>
  </div>

<!-- Heatmap (from index2.html) -->
<script>
(function(){
  const container = d3.select('#calendar');
  const csvPath = '/data/calendar_data_modified.csv';
  const cellSize = 14;
  const margin = {top: 18, right: 16, bottom: 18, left: 26};
  const monthLabelY = 10;
  const color = window.heatColorScale || (window.heatColorScale = d3.scaleSequential(d3.interpolateRdYlGn).domain([100, 0]));
  const tip = d3.select('#tip');

  // 周日置顶：行索引 Sunday=0..Saturday=6；列按周日为起点
  function dayIndexSunday(d){ return d.getDay(); }
  function weekColSunday(d){ return d3.timeSunday.count(d3.timeYear(d), d); }
  function weeksInYear(year){
    const s = new Date(year,0,1);
    const e = new Date(year,11,31);
    // 使用以周日为起点的周计数，保证列布局与周日到周六顺序一致
    return d3.timeSunday.count(d3.timeYear(s), d3.timeDay.offset(e,1)) + 1;
  }
  const fmtISO = d3.timeFormat('%Y-%m-%d');

  d3.csv(csvPath, d => ({ date: new Date(d.date), value: +d.value || 0 }))
    .then(rows => {
      rows.sort((a,b) => a.date - b.date);
      const byKey = new Map(rows.map(r => [fmtISO(r.date), r.value]));
      const years = Array.from(new Set(rows.map(r => r.date.getFullYear()))).sort((a,b) => a - b);
      years.forEach(year => {
        const s = new Date(year, 0, 1);
        const e = new Date(year, 11, 31);
        const days = d3.timeDay.range(s, d3.timeDay.offset(e, 1)).map(d => ({ date: d, value: byKey.get(fmtISO(d)) ?? 0 }));
        const weeks = weeksInYear(year);

        const width = margin.left + margin.right + weeks * cellSize;
        const height = margin.top + margin.bottom + 7 * cellSize + monthLabelY;

        const wrap = container.append('div')
          .attr('class', 'calendar-year')
          .attr('data-year', year)
          .style('cursor','pointer')
          .on('click', () => { if (window.renderSpiral) window.renderSpiral(year); });
        const header = wrap.append('div').attr('class', 'year-header');
        header.append('div').attr('class', 'year-title').text(`${year}`);

        const svg = wrap.append('svg')
          .attr('viewBox', `0 0 ${width} ${height}`)
          .attr('preserveAspectRatio', 'xMidYMid meet');

        const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

        const dow = ['日','一','二','三','四','五','六'];
        g.selectAll('text.dow-label')
          .data(dow)
          .join('text')
          .attr('class','dow-label')
          .attr('x', -8)
          .attr('y', (d,i) => (i + 0.75) * cellSize)
          .attr('text-anchor','end')
          .text(d => d);

        g.selectAll('rect.cell')
          .data(days)
          .join('rect')
          .attr('class','cell')
          .attr('width', cellSize)
          .attr('height', cellSize)
          // 每列的x基于以周日为起点的周序号，确保列内自上而下为周日至周六
          .attr('x', d => weekColSunday(d.date) * cellSize)
          .attr('y', d => dayIndexSunday(d.date) * cellSize)
          .attr('rx', 2).attr('ry', 2)
          .attr('fill', d => color(d.value))
          .attr('data-iso', d => fmtISO(d.date))
          .attr('data-week', d => weekColSunday(d.date))
          .attr('data-dow', d => dayIndexSunday(d.date))
          .on('mouseenter', (ev, d) => {
            const fmt = d3.timeFormat('%Y-%m-%d');
            tip.style('opacity', 1)
              .html(`<strong>${fmt(d.date)}</strong><br/>值：${d.value}`)
              .style('left', (ev.clientX + 12) + 'px')
              .style('top', (ev.clientY - 8) + 'px');
          })
          .on('mousemove', (ev) => {
            tip.style('left', (ev.clientX + 12) + 'px')
               .style('top', (ev.clientY - 8) + 'px');
          })
          .on('mouseleave', () => tip.style('opacity', 0))
          .on('click', (ev, d) => {
            // 阻止冒泡到年份卡片点击
            ev.stopPropagation();
            if (ev.preventDefault) ev.preventDefault();
            if (window.selectDay) {
              const iso = fmtISO(d.date);
              window.selectDay(iso);
            }
          });

          // 判断是否为每月第一天
function isFirstDayOfMonth(date) {
  return date.getDay() !== 0 && date.getMonth() > 0 && date.getDate() === 1;//不是周日，不是一月
}
function isMonthDivider(date) {
  // 计算7天前的日期
    const sevenDaysAgo = d3.timeDay.offset(date, -7);
    
    // 比较两个日期的年份和月份
    // getMonth() 返回的月份从0开始（0代表一月）
    return date.getFullYear() !== sevenDaysAgo.getFullYear() || 
           date.getMonth() !== sevenDaysAgo.getMonth();
}

g.selectAll('cell.firstday')
  .data(days.filter(d => isFirstDayOfMonth(d.date))) // 只对满足条件的数据
  .join('line')
  .attr('class', 'month-boundary')
  .attr('x1', d => weekColSunday(d.date) * cellSize) // 左边线的x坐标
  .attr('y1', d => dayIndexSunday(d.date) * cellSize) // 上端点y坐标
  .attr('x2', d => weekColSunday(d.date) * cellSize + cellSize) // 右边线的x坐标（与x1相同）
  .attr('y2', d => dayIndexSunday(d.date) * cellSize) // 下端点y坐标
  .attr('stroke', '#ff6b6b') // 高亮颜色
  .attr('stroke-width', 2)   // 线条粗细
  .attr('pointer-events', 'none'); // 不干扰交互

  g.selectAll('cell.divider')
  .data(days.filter(d => isMonthDivider(d.date))) // 只对满足条件的数据
  .join('line')
  .attr('class', 'month-boundary')
  .attr('x1', d => weekColSunday(d.date) * cellSize) // 左边线的x坐标
  .attr('y1', d => dayIndexSunday(d.date) * cellSize) // 上端点y坐标
  .attr('x2', d => weekColSunday(d.date) * cellSize) // 右边线的x坐标（与x1相同）
  .attr('y2', d => dayIndexSunday(d.date) * cellSize + cellSize) // 下端点y坐标
  .attr('stroke', '#ff6b6b') // 高亮颜色
  .attr('stroke-width', 2)   // 线条粗细
  .attr('pointer-events', 'none'); // 不干扰交互
        const months = d3.timeMonth.range(s, d3.timeMonth.offset(e,1));

        const monthFmt = d3.timeFormat('%b');
        g.append('g')
          .selectAll('text.month-label')
          .data(months)
          .join('text')
          .attr('class','month-label')
          // 月份标签位置基于周日起点的周序号
          .attr('x', m => (weekColSunday(m) + 0.5) * cellSize)
          .attr('y', -6)
          .attr('text-anchor','middle')
          .text(m => monthFmt(m));
      });
    });

  const legend = d3.select('#legend');
  legend.append('span').attr('class','legend-text').text('低');
  d3.range(0, 6).forEach(i => {
    const v = i / 5 * 100;
    legend.append('div').attr('class','swatch').style('background', color(v));
  });
  legend.append('span').attr('class','legend-text').text('高');
})();
</script>

<!-- Spiral calendar (original index.html) -->
<script>
(function() {
  const csvPath = '/data/calendar_data_modified.csv';

  async function renderSpiral(yearDesired) {
    if (!window._spiralRows) {
      window._spiralRows = await d3.csv(csvPath, d => ({ date: new Date(d.date), value: +d.value || 0 }));
      window._spiralRows.sort((a,b) => a.date - b.date);
    }
    const rows = window._spiralRows;
    const years = Array.from(new Set(rows.map(r => r.date.getFullYear()))).sort((a,b) => a - b);
    const year = (yearDesired != null) ? yearDesired : years[years.length - 1];
    const prevYear = window._spiralLastYear;
    const animate = (prevYear === undefined) || (prevYear !== year);
    // 当右侧螺旋图切换到不同年份时，清除左侧热力图的高亮
    if (animate && window.clearHeatHighlight) {
      window.clearHeatHighlight();
    }

    // 清空并重绘面板
    const panelSel = d3.select('#spiral-panel');
    panelSel.selectAll('*').remove();

  // 画布与坐标系配置
  const width = 800, height = 800;
  const svg = panelSel
    .append('svg')
    .attr('width', width)
    .attr('height', height)
    .attr('viewBox', `${-width/2} ${-height/2} ${width} ${height}`);

  // 放大螺旋图：不改变 SVG 尺寸，仅在根分组上缩放
  const spiralScale = 1.06; // 适度放大，避免边缘裁切
  const root = svg.append('g')
    .attr('class','spiral-root')
    .attr('transform', `scale(${spiralScale})`);

  // 与左侧热力图共享颜色尺度（0-100）
  const heatColor = window.heatColorScale || (window.heatColorScale = d3.scaleSequential(d3.interpolateRdYlGn).domain([100, 0]));

  // 文本颜色选择：根据背景颜色提高对比度
  function relLuminance(colorStr){
    const c = d3.color(colorStr);
    if(!c) return 0; // fallback
    const rgb = [c.r, c.g, c.b].map(v => {
      v /= 255;
      return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4);
    });
    return 0.2126*rgb[0] + 0.7152*rgb[1] + 0.0722*rgb[2];
  }
  function contrastRatio(fg, bg){
    const L1 = relLuminance(fg) + 0.05;
    const L2 = relLuminance(bg) + 0.05;
    return L1 > L2 ? L1/L2 : L2/L1;
  }
  function pickTextColor(bg, prefer){
    const threshold = 4.5; // 小字号文本建议对比度
    if (prefer && contrastRatio(prefer, bg) >= threshold) return prefer;
    // 备选颜色中选择对比度最高的
    const candidates = ['#1a1d22', '#ffffff', '#eaeef4'];
    let best = candidates[0], bestRatio = 0;
    for (const c of candidates){
      const r = contrastRatio(c, bg);
      if (r > bestRatio){ best = c; bestRatio = r; }
    }
    return best;
  }

  const centerX = 0, centerY = 0;

  // 极坐标核心参数
  // 1. 数据准备：直接加载 CSV 并构造该年份的完整日期数组，缺失填充
  const fmtISO = d3.timeFormat('%Y-%m-%d');
    const byKey = new Map(rows.map(r => [fmtISO(r.date), r.value]));
    window._spiralByKey = byKey;
  const startDate = new Date(year, 0, 1);
  const endDate = new Date(year, 11, 31);
  const months = d3.range(1, 13);
  const data = d3.timeDay.range(startDate, d3.timeDay.offset(endDate, 1)).map(dt => {
    const m = dt.getMonth() + 1;
    const iso = fmtISO(dt);
    return {
      year,
      month: m,
      day: dt.getDate(),
      weekDay: dt.getDay(),
      monthDays: new Date(year, m, 0).getDate(),
      id: iso,
      value: byKey.get(iso) ?? 0
    };
  });

  // 2. 螺旋坐标参数（阿基米德螺旋 r = a + bθ）
  const boxSize = 32;
  const stepLen = boxSize;               // 邻接：步长等于方框宽度
  const a = -0;                          // 初始半径（调小以缩小中心空洞）
  const coilGap = boxSize;               // 希望相邻圈之间的径向间距等于方框厚度
  const b = coilGap / (2 * Math.PI);     // 使相邻圈几乎无缝贴合（Δr = 2πb = boxSize）
  const rStart = 360;                    // 起始半径，保证一月在最外层
  let theta = (rStart - a) / b;          // 从外沿开始
  const thetaStart = theta;              // 记录开始角度用于绘制整体边界

  // 计算当前位置与切线角度
  function pos(t) {
    const r = a + b * t;
    const x = r * Math.cos(t);
    const y = r * Math.sin(t);
    const dxdt = b * Math.cos(t) - r * Math.sin(t);
    const dydt = b * Math.sin(t) + r * Math.cos(t);
    const tangentDeg = Math.atan2(dydt, dxdt) * 180 / Math.PI;
    return { r, x, y, tangentDeg };
  }

  // 螺旋边界坐标（外/内）
  function posOuter(t) {
    const r = a + b * t + coilGap/2;
    return { x: r * Math.cos(t), y: r * Math.sin(t) };
  }
  function posInner(t) {
    const r = a + b * t - coilGap/2;
    return { x: r * Math.cos(t), y: r * Math.sin(t) };
  }

  // 生成沿螺旋的扇环段路径（相邻段边界一致，保证无缝）
  function segmentPath(t0, t1, samples = 6) {
    const dt = (t1 - t0) / samples;
    let d = '';
    // 外边界：t0 -> t1
    let t = t0;
    let p = posOuter(t);
    d += `M ${p.x} ${p.y}`;
    for (let i=1; i<=samples; i++) {
      t = t0 + dt * i;
      p = posOuter(t);
      d += ` L ${p.x} ${p.y}`;
    }
    // 内边界：t1 -> t0（回程）
    for (let i=samples; i>=0; i--) {
      t = t0 + dt * i;
      p = posInner(t);
      d += ` L ${p.x} ${p.y}`;
    }
    d += ' Z';
    return d;
  }

  function segmentMid(t0, t1) {
    const tm = (t0 + t1) / 2;
    return pos(tm);
  }

  // 按给定曲线长度前进，返回新位置
  function advance(len, dir = -1) { // 默认向内推进
    const r = a + b * theta;
    const dtheta = (len / Math.sqrt(b*b + r*r)) * dir;
    theta += dtheta;
    const p = pos(theta);
    spiralPoints.push([p.x, p.y]);
    return p;
  }

  // 3. 分层分组与中心文字
  const centerMain = root.append('text')
     .attr('class','center-main')
     .attr('x', centerX)
     .attr('y', centerY + 2)
     .text(year);
  const centerSub = root.append('text')
     .attr('class','center-sub')
     .attr('x', centerX)
     .attr('y', centerY + 26)
     .text('');
  const spiralLayer = root.append('g').attr('class','spiral');
  const itemsLayer = root.append('g').attr('class','items');
  const edgesLayer  = root.append('g').attr('class','edges');
  // 新增：用于动画逐步显示的日段分组（按月份分桶）
  const daysByMonthGroup = new Map();

  // 4. 顺序沿螺旋绘制：月份缩写 + 日期方框
  const monthsAbbr = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const monthLettersMap = new Map();
  const spiralPoints = [];
  spiralPoints.push([pos(theta).x, pos(theta).y]);

  const dataByMonth = d3.group(data, d => d.month);
  // 英文星期的前两个字母（首字母大写、第二个字母小写）
  const weekTwoLettersEn = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  const weekNamesZh = ['周日','周一','周二','周三','周四','周五','周六'];

  months.forEach(m => {
    // 首字母单扇环段，并与后续日期段无缝衔接
    const ch = monthsAbbr[m-1];
    const letterSegs = [];
    {
      const t0 = theta;
      const r = a + b * t0;
      const dtheta = (stepLen / Math.sqrt(b*b + r*r)) * -1;
      const t1 = t0 + dtheta;
      const pathD = segmentPath(t0, t1);
      const pathSel = itemsLayer.append('path')
        .attr('class', 'seg letter-seg')
        .attr('d', pathD);
      const mid = segmentMid(t0, t1);
      itemsLayer.append('text')
        .attr('class','letter-text')
        .attr('transform', `translate(${mid.x},${mid.y})`)
        .text(ch);
      // 扇环两条径向直边的淡色描边
      const p0o = posOuter(t0), p0i = posInner(t0);
      const p1o = posOuter(t1), p1i = posInner(t1);
      edgesLayer.append('line')
        .attr('class','segment-edge')
        .attr('x1', p0o.x).attr('y1', p0o.y)
        .attr('x2', p0i.x).attr('y2', p0i.y);
      edgesLayer.append('line')
        .attr('class','segment-edge')
        .attr('x1', p1o.x).attr('y1', p1o.y)
        .attr('x2', p1i.x).attr('y2', p1i.y);
      letterSegs.push(pathSel.node());
      theta = t1;
      spiralPoints.push([mid.x, mid.y]);
    }
    monthLettersMap.set(m, letterSegs);

    // 绘制本月的每一天，方框沿曲线等距分布、紧挨排列
    const monthDays = dataByMonth.get(m);
    // 为每个月建立一个子分组，初始不显示（opacity 0），待动画逐日显示
    const monthDaysGroup = itemsLayer.append('g')
      .attr('class', `month-days month-${m}`)
      .attr('opacity', 0);
    daysByMonthGroup.set(m, monthDaysGroup);

    monthDays.forEach(d => {
      const t0 = theta;
      const r = a + b * t0;
      const dtheta = (stepLen / Math.sqrt(b*b + r*r)) * -1;
      const t1 = t0 + dtheta;
      const pathD = segmentPath(t0, t1);
      // 扇环背景颜色按天与热力图对应（共享颜色尺度）
      const fillColor = heatColor(d.value);
      const pathSel = monthDaysGroup.append('path')
        .attr('class', 'seg')
        .attr('d', pathD)
        .attr('fill', fillColor)
        .attr('data-iso', d.id);
      const mid = segmentMid(t0, t1);
      const preferColor = (d.weekDay === 0 || d.weekDay === 1) ? '#ee9b4c' : '#9e9e9e';
      const textColor = pickTextColor(fillColor, preferColor);
      const textSel = monthDaysGroup.append('text')
        .attr('class','seg-text')
        .attr('transform', `translate(${mid.x},${mid.y})`)
        .attr('fill', textColor)
        .attr('data-iso', d.id)
        .text(`${weekTwoLettersEn[d.weekDay]} ${d.day}`);

      // 扇环两条径向直边的淡色描边
      const q0o = posOuter(t0), q0i = posInner(t0);
      const q1o = posOuter(t1), q1i = posInner(t1);
      edgesLayer.append('line')
        .attr('class','segment-edge')
        .attr('x1', q0o.x).attr('y1', q0o.y)
        .attr('x2', q0i.x).attr('y2', q0i.y);
      edgesLayer.append('line')
        .attr('class','segment-edge')
        .attr('x1', q1o.x).attr('y1', q1o.y)
        .attr('x2', q1i.x).attr('y2', q1i.y);

      pathSel.on('click', () => {
        if (window.selectDay) window.selectDay(d.id);
      });
      textSel.on('click', () => {
        if (window.selectDay) window.selectDay(d.id);
      });

      pathSel.append('title')
        .text(`${d.year}年${d.month}月${d.day}日 ${weekNamesZh[d.weekDay]} 值：${d.value}`);

      theta = t1;
      spiralPoints.push([mid.x, mid.y]);
    });
  });

  // 5. 绘制螺旋参考路径（置于底层）
  const line = d3.line().curve(d3.curveNatural);
  spiralLayer.append('path')
    .attr('class','spiral-path')
    .attr('d', line(spiralPoints));

  // 6. 绘制整体外/内边界线以增强对比（颜色独立于段填充）
  const thetaEnd = theta; // 当前为结束角度（已经推进到最后）
  const stepEdge = 0.05;  // 采样步长，越小越平滑
  const outerPts = [];
  const innerPts = [];
  for (let t = thetaStart; t >= thetaEnd; t -= stepEdge) {
    const po = posOuter(t);
    const pi = posInner(t);
    outerPts.push([po.x, po.y]);
    innerPts.push([pi.x, pi.y]);
  }
  edgesLayer.append('path')
    .attr('class','spiral-edge')
    .attr('d', d3.line()(outerPts));
  edgesLayer.append('path')
    .attr('class','spiral-edge')
    .attr('d', d3.line()(innerPts));

  // 动画：先显示月份扇环，再并行从每月1号逐步显示到月底
  // 1) 立即显示月份首字母扇环（已绘制可见），保持日段分组隐藏（opacity 0）
  // 2) 并行逐日显示：按 day=1..31 循环，对每个月选择对应日的元素显示
  const maxDays = 31;
  const stepMs = 40; // 每一日的步进时长
  const easeFn = d3.easeCubicOut;

  if (animate) {
    // 构建每月每日的选择器缓存，提高选择效率
    const monthDaySelectors = new Map();
    daysByMonthGroup.forEach((gSel, m) => {
      const nodes = gSel.selectAll('path.seg').nodes();
      const textNodes = gSel.selectAll('text.seg-text').nodes();
      monthDaySelectors.set(m, { paths: nodes, texts: textNodes });
    });

    // 先把各月分组整体淡入（仅显示容器，不显示具体日元素）
    daysByMonthGroup.forEach((gSel) => {
      gSel.transition().duration(200).attr('opacity', 1);
      // 初始化：隐藏子元素
      gSel.selectAll('path.seg').style('opacity', 0);
      gSel.selectAll('text.seg-text').style('opacity', 0);
    });

    // 并行按日索引逐步显示
    for (let dayIndex = 1; dayIndex <= maxDays; dayIndex++) {
      const delay = dayIndex * stepMs;
      daysByMonthGroup.forEach((gSel, m) => {
        const sel = monthDaySelectors.get(m);
        if (!sel) return;
        const idx = dayIndex - 1;
        if (idx < sel.paths.length) {
          const pathNode = sel.paths[idx];
          const textNode = sel.texts[idx];
          d3.select(pathNode)
            .transition()
            .delay(delay)
            .duration(220)
            .ease(easeFn)
            .style('opacity', 1);
          d3.select(textNode)
            .transition()
            .delay(delay)
            .duration(220)
            .ease(easeFn)
            .style('opacity', 1);
        }
      });
    }
  } else {
    // 同一年重复点击：直接显示，无动画
    daysByMonthGroup.forEach((gSel) => {
      gSel.attr('opacity', 1);
      gSel.selectAll('path.seg').style('opacity', 1);
      gSel.selectAll('text.seg-text').style('opacity', 1);
    });
  }

  // 记录本次展示年份，用于控制后续动画出现与否
  window._spiralLastYear = year;
  }

  // 全局：高亮螺旋中的某一天，并更新中心信息
  window.highlightSpiralDay = function(iso) {
    const panel = d3.select('#spiral-panel');
    panel.selectAll('.seg.highlight').classed('highlight', false);
    const seg = panel.select(`path.seg[data-iso="${iso}"]`);
    seg.classed('highlight', true);
    // 将高亮段置顶，避免被其他段覆盖
    try { seg.raise(); } catch(e) {}
    // 同步将文字也置顶，确保不被其他元素遮挡
    const segText = panel.select(`text.seg-text[data-iso="${iso}"]`);
    try { segText.raise(); } catch(e) {}
    // 触发一次呼吸动画
    try {
      seg.classed('pulse', true);
      segText.classed('pulse', true);
      setTimeout(() => {
        seg.classed('pulse', false);
        segText.classed('pulse', false);
      }, 650);
    } catch(e) {}
    // 更新中心信息
    const dt = new Date(iso);
    const value = (window._spiralByKey && window._spiralByKey.get(iso)) ?? 0;
    const weekNamesZh = ['周日','周一','周二','周三','周四','周五','周六'];
    panel.select('text.center-main').text(`${dt.getFullYear()}年${dt.getMonth()+1}月${dt.getDate()}日`);
    panel.select('text.center-sub').text(`${weekNamesZh[dt.getDay()]} ${value}`);
  };

  // 全局：高亮热力图中的某一天格子
  window.highlightHeatCell = function(iso) {
    const cal = d3.select('#calendar');
    cal.selectAll('rect.cell.active').classed('active', false);
    const cell = cal.select(`rect.cell[data-iso="${iso}"]`);
    cell.classed('active', true);
    // 置顶以确保高亮边框不被月边界遮挡
    try { cell.raise(); } catch(e) {}
    // 触发一次呼吸动画
    try {
      cell.classed('pulse', true);
      setTimeout(() => { cell.classed('pulse', false); }, 650);
    } catch(e) {}
  };

  // 清除左侧热力图的高亮（用于右侧年份切换后）
  window.clearHeatHighlight = function() {
    const cal = d3.select('#calendar');
    cal.selectAll('rect.cell.active').classed('active', false);
  };

  // 全局：选择某一天，跨图联动与必要的年份切换
  window.selectDay = function(iso) {
    // 左侧高亮
    window.highlightHeatCell(iso);
    const targetYear = new Date(iso).getFullYear();
    const currentYear = window._spiralLastYear;
    if (currentYear === undefined || currentYear !== targetYear) {
      if (window.renderSpiral) {
        window.renderSpiral(targetYear).then(() => {
          window.highlightSpiralDay(iso);
        });
      }
    } else {
      window.highlightSpiralDay(iso);
    }
  };
  window.renderSpiral = renderSpiral;
  renderSpiral();
})();
</script>
